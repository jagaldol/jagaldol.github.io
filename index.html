<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>새 포트폴리오로 이동합니다</title>
  <link rel="canonical" href="https://jagaldol.com/">
  <script>
    const destination = "https://jagaldol.com" + window.location.pathname + window.location.search + window.location.hash;
    window.location.replace(destination);
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("destination").href = destination;
    });
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=https://jagaldol.com/"></noscript>
</head>
<body>
  <p>포트폴리오가 새 주소로 이전했습니다. <a id="destination" href="https://jagaldol.com/">jagaldol.com으로 이동</a></p>
</body>
</html>
